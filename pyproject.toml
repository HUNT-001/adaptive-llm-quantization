[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "anvil-opt"
version = "0.1.0"
description = "Planning-based AI optimization agent for Arm, powered by Arm Performix"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Pavan" }]
keywords = ["arm", "optimization", "inference", "quantization", "performix", "planning"]
dependencies = []

[project.optional-dependencies]
viz = ["matplotlib>=3.5"]
dev = ["pytest>=7", "matplotlib>=3.5"]

[project.scripts]
anvil = "anvil.cli:main"

[tool.setuptools]
packages = ["anvil"]
